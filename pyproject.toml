[project]
name = "podocenter"
version = "0.4.0"
description = "Sistema de gestión para centros de podología (PFC — UCSM)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
exclude = ["*/migrations/*", "frontend"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I orden de importaciones · N nombres
# B bugbear · S bandit · DJ reglas de Django · C4 comprensiones · UP sintaxis moderna
select = ["E", "W", "F", "I", "N", "B", "S", "DJ", "C4", "UP", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]          # assert es el modo normal de escribir pruebas
"*/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["backend"]
testpaths = ["backend/apps"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["backend/apps"]
omit = ["*/migrations/*", "*/tests/*", "*/apps.py"]

[tool.bandit]
exclude_dirs = ["backend/apps/*/tests", "frontend"]
