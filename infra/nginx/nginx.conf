# Nginx hace dos cosas: sirve la SPA ya compilada y reenvía /api y /admin al
# servidor de aplicaciones. Ambas cosas viajan por la misma procedencia, que
# es lo que permite usar cookie de sesión con CSRF en lugar de un token
# guardado en el navegador (Práctica N.° 5, RNF01).
upstream aplicacion {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Redirección a HTTPS: el certificado lo termina el balanceador o certbot.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certificados/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificados/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Cabeceras de seguridad (OWASP A05).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API y administración -------------------------------------------
    location ~ ^/(api|admin)/ {
        proxy_pass         http://aplicacion;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos estáticos de Django (los del admin).
    location /static/ {
        alias /var/www/estaticos/;
        expires 30d;
        access_log off;
    }

    # --- SPA -------------------------------------------------------------
    root /var/www/spa;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El enrutamiento lo resuelve Vue en el navegador: cualquier ruta
    # desconocida devuelve el index y es el router quien decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
